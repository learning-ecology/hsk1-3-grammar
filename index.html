<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Steps HSK 1–3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* =====================================================================
   Grammar Steps — HSK 1–3. Calm, legible, touch-friendly.
   Chinese dominant; pinyin and translations secondary.
   ===================================================================== */
:root {
  --fs: 1;
  --bg: #F3F5F9; --surface: #FFFFFF; --surface-2: #EDF0F6; --ink: #1B2233; --ink-2: #48526B; --ink-3: #78819A; --line: #DAE0EA;
  --accent: #2B4DC0; --accent-2: #1F3A99; --accent-soft: #E3E9FB; --on-accent: #FFFFFF;
  --ok: #1B8551; --ok-soft: #DFF3E8; --bad: #C23B2C; --bad-soft: #FBE5E1; --mid: #A86C0C; --mid-soft: #FAEFD9;
  --lv1: #1E8F5E; --lv2: #2B63D0; --lv3: #8447C8;
  --r-who: #2B63D0; --r-when: #B7770A; --r-time: #C9650C; --r-where: #1E8F5E; --r-act: #C23B2C; --r-what: #7A45C7; --r-neg: #5A6378;
  --r-q: #CC3470; --r-adv: #0C8585; --r-link: #85622A; --r-mw: #A0478A; --r-desc: #C9650C; --r-res: #2A7896; --r-mark: #66748A; --r-how: #3F8A25; --r-cond: #946300;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 14px rgba(20, 30, 60, .05);
  --font: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-zh: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #11151F; --surface: #191F2D; --surface-2: #212838; --ink: #E7EBF4; --ink-2: #B4BCD0; --ink-3: #8790A8; --line: #2E3649;
    --accent: #7D97F2; --accent-2: #9DB1F7; --accent-soft: #232E52; --on-accent: #0F1528;
    --ok: #4CC389; --ok-soft: #173A2A; --bad: #F07A6B; --bad-soft: #43221F; --mid: #E8B55A; --mid-soft: #3C2F16;
    --lv1: #4CC389; --lv2: #7D97F2; --lv3: #B98CF0;
    --r-who: #7D97F2; --r-when: #E8B55A; --r-time: #F0995A; --r-where: #4CC389; --r-act: #F07A6B; --r-what: #B98CF0; --r-neg: #A2AAC0;
    --r-q: #F07AA6; --r-adv: #4FC6C6; --r-link: #D2AE70; --r-mw: #D98BC6; --r-desc: #F0995A; --r-res: #6CC0DE; --r-mark: #A2AAC0; --r-how: #8FCF6E; --r-cond: #E0B24E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #11151F; --surface: #191F2D; --surface-2: #212838; --ink: #E7EBF4; --ink-2: #B4BCD0; --ink-3: #8790A8; --line: #2E3649;
  --accent: #7D97F2; --accent-2: #9DB1F7; --accent-soft: #232E52; --on-accent: #0F1528;
  --ok: #4CC389; --ok-soft: #173A2A; --bad: #F07A6B; --bad-soft: #43221F; --mid: #E8B55A; --mid-soft: #3C2F16;
  --lv1: #4CC389; --lv2: #7D97F2; --lv3: #B98CF0;
  --r-who: #7D97F2; --r-when: #E8B55A; --r-time: #F0995A; --r-where: #4CC389; --r-act: #F07A6B; --r-what: #B98CF0; --r-neg: #A2AAC0;
  --r-q: #F07AA6; --r-adv: #4FC6C6; --r-link: #D2AE70; --r-mw: #D98BC6; --r-desc: #F0995A; --r-res: #6CC0DE; --r-mark: #A2AAC0; --r-how: #8FCF6E; --r-cond: #E0B24E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: calc(16px * var(--fs)); line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1 { font-size: 1.7em; line-height: 1.25; margin: .2em 0 .3em; text-wrap: balance; font-weight: 600; }
h2 { font-size: 1.2em; margin: 1.2em 0 .5em; font-weight: 600; text-wrap: balance; }
h3 { font-size: 1.02em; margin: 1em 0 .4em; font-weight: 600; }
.card h2:first-child, .card h3:first-child { margin-top: 0; }
p { margin: .4em 0; }
.zh { font-family: var(--font-zh); }
.vi { color: var(--ink-2); }
.en { color: var(--ink); }
.muted { color: var(--ink-3); }
.small { font-size: .86em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { font-size: .72em; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
.h-vi { font-size: .6em; color: var(--ink-3); font-weight: 400; }

/* ---------- shell ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, calc((100vw - 1040px) / 2)); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
.logo { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 1.05em; font-weight: 700; }
.brand-t { display: flex; flex-direction: column; line-height: 1.15; }
.brand-t b { font-size: .98em; } .brand-t span { font-size: .75em; color: var(--ink-3); }
.top-nav { display: flex; gap: 4px; margin: 0 auto; }
.top-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.nav-b { position: relative; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 8px 12px; border-radius: 10px; color: var(--ink-2); font-weight: 500; }
.nav-b .vi { font-size: .78em; color: var(--ink-3); }
.nav-b.on { background: var(--accent-soft); color: var(--accent-2); }
.nav-b .badge { background: var(--bad); color: #fff; border-radius: 99px; font-size: .7em; padding: 0 6px; min-width: 18px; text-align: center; }
.aa { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.bot-nav { display: none; }
main { max-width: 840px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 110px; outline: none; }
.settings { position: fixed; right: 16px; top: 72px; z-index: 40; width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.set-head { display: flex; justify-content: space-between; align-items: center; }
.x { border: 0; background: none; font-size: 1.1em; padding: 4px 8px; }
.set-l { font-weight: 600; font-size: .9em; margin-bottom: 4px; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg-ctl button { border: 0; background: var(--surface); padding: 7px 12px; min-width: 44px; }
.seg-ctl button + button { border-left: 1px solid var(--line); }
.seg-ctl button.on { background: var(--accent); color: var(--on-accent); }
.seg-ctl.dis { opacity: .5; }
@media (max-width: 760px) {
  .top-nav { display: none; }
  .bot-nav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .bot-nav .nav-b { flex-direction: column; gap: 0; padding: 6px 2px; font-size: .78em; }
  .bot-nav .nav-b .vi { display: none; }
  .bot-nav .ic { font-size: 1.35em; }
  .bot-nav .badge { position: absolute; top: 2px; right: 18%; }
  .brand-t span { display: none; }
  h1 { font-size: 1.45em; }
}

/* ---------- common widgets ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-2); }
.btn.big { min-height: 52px; padding: 10px 22px; font-size: 1.02em; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: .9em; }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; min-height: 36px; font-size: .88em; }
.pill.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 10px; font-size: .78em; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.bad, .chip.err { background: var(--bad-soft); color: var(--bad); } .chip.mid { background: var(--mid-soft); color: var(--mid); }
.chip.lv { color: #fff; font-weight: 600; } .chip.lv1 { background: var(--lv1); } .chip.lv2 { background: var(--lv2); } .chip.lv3 { background: var(--lv3); }
:root[data-theme="dark"] .chip.lv { color: #0F1528; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.lv { color: #0F1528; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.card + .card, section.card { margin-top: 14px; }
.empty { text-align: center; color: var(--ink-2); padding: 28px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.actions.center { justify-content: center; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 60; max-width: calc(100vw - 32px); text-align: center; }
.speak { border: 0; background: var(--surface-2); border-radius: 99px; width: 34px; height: 34px; font-size: .9em; flex: none; vertical-align: middle; }
.speak:hover { background: var(--accent-soft); }
.speak.slow { width: 34px; }
.zhw { display: inline-flex; flex-direction: column; gap: 1px; }
.zhline { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.zhw .zh { font-size: 1.28em; line-height: 1.45; }
.zhw.big .zh { font-size: 1.5em; }
.zhw.small .zh { font-size: 1em; }
.py { color: var(--ink-3); font-size: .84em; letter-spacing: .01em; }
.tapable { display: none; }
.reveal-py .tapable { display: block; }
.bi .en + .vi { margin-top: 2px; }
details > summary { cursor: pointer; font-weight: 600; list-style-position: inside; padding: 2px 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 600px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; margin: 0 !important; min-height: 110px; }
.tile.wide { flex-direction: row; align-items: center; gap: 14px; width: 100%; min-height: 0; }
.tile-ic { font-size: 1.6em; }
.tile:hover, .rv:hover, .node:hover, .pick-row:hover, .gp-row:hover { border-color: var(--accent); }

/* ---------- learn home & map ---------- */
.hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--accent); color: var(--on-accent); border-radius: 20px; padding: 22px; }
.hero .muted, .hero .eyebrow { color: color-mix(in srgb, var(--on-accent) 78%, transparent); }
.hero h1 { margin: 2px 0; font-size: 2em; }
.eyebrow { font-size: .78em; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.hero .btn.primary { background: var(--on-accent); color: var(--accent-2); border-color: var(--on-accent); }
.mini-stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 18px; }
.mini-stats > div { flex: 1 1 140px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-variant-numeric: tabular-nums; }
.mini-stats b { font-size: 1.25em; } .mini-stats span { color: var(--ink-3); font-size: .85em; }
.lv-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lv-tab { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; font-variant-numeric: tabular-nums; }
.lv-tab span { font-size: .8em; color: var(--ink-3); }
.lv-tab.on.lv1 { border-color: var(--lv1); } .lv-tab.on.lv2 { border-color: var(--lv2); } .lv-tab.on.lv3 { border-color: var(--lv3); }
.lv-tab.on { box-shadow: var(--shadow); }
.lv-desc { margin: 10px 2px 4px; }
.map { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
.unit { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.unit-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.unit-head .zh { font-size: 1.15em; font-weight: 600; }
.unit-no { font-size: .75em; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.path { display: flex; flex-direction: column; gap: 6px; position: relative; }
.path::before { content: ''; position: absolute; left: 21px; top: 20px; bottom: 20px; width: 2px; background: var(--line); }
.node { position: relative; display: flex; align-items: center; gap: 12px; border: 1px solid transparent; background: none; border-radius: 12px; padding: 6px 8px 6px 0; text-align: left; min-height: 52px; }
.node .dot { position: relative; z-index: 1; flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); font-weight: 600; font-variant-numeric: tabular-nums; }
.node.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.node.cur .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 5px var(--accent-soft); }
.node.review .dot { color: var(--mid); border-style: dashed; }
.node.review.done .dot { background: var(--mid); border-color: var(--mid); color: #fff; }
.node-txt { display: flex; flex-direction: column; line-height: 1.3; flex: 1; }
.node-txt .zh { font-size: 1.12em; }
.cur-chip { background: var(--accent-soft); color: var(--accent-2); }

/* ---------- lesson ---------- */
.lesson-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.lesson-head h1 { margin: 6px 0 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lesson-head h1 .zh { font-size: 1.3em; }
.lesson-head .sub { color: var(--ink-2); font-size: 1.05em; }
.goal { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.stepper { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 16px 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 10; background: var(--bg); padding: 6px 0; }
.step { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 4px; min-height: 64px; }
.step .n { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); font-size: .82em; font-weight: 600; }
.step .st-en { font-size: .82em; font-weight: 600; } .step .st-vi { font-size: .72em; color: var(--ink-3); }
.step.done .n { background: var(--ok); color: #fff; }
.step.on { border-color: var(--accent); background: var(--accent-soft); }
.step.on .n { background: var(--accent); color: var(--on-accent); }
@media (max-width: 520px) { .step .st-vi { display: none; } .step { min-height: 56px; } .step .st-en { font-size: .72em; } }
.tap-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.word { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); }
.word .zh { font-size: 1.55em; font-weight: 500; }
.word .mean { font-size: .84em; margin-top: 2px; }
.point .pt-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.point .pt-head h2 { margin: 0; font-size: 1.45em; flex: 1 1 60%; min-width: 0; }
@media (max-width: 560px) { .point .pt-head h2 { font-size: 1.25em; flex-basis: calc(100% - 50px); } }
.pt-n { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.point > div { margin-top: 14px; }
.meaning .m-en { font-size: 1.12em; font-weight: 500; } .meaning .m-vi { font-size: 1.02em; }
.pattern .pat { font-size: 1.15em; background: var(--accent-soft); color: var(--accent-2); border-radius: 10px; padding: 10px 14px; font-weight: 600; overflow-wrap: anywhere; }
.why-box, .tip, .mistake { border-left: 4px solid var(--line); padding: 4px 0 4px 12px; }
.tip { border-color: var(--mid); } .mistake { border-color: var(--bad); }
.mis-row { margin-top: 6px; }
.wrongtxt { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1px; font-size: 1.1em; }
.righttxt { color: var(--ok); font-size: 1.15em; display: flex; align-items: center; gap: 6px; }
.ex-list { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 12px; }
.ex-list li::marker { color: var(--ink-3); font-size: .9em; }
.ex-list .en, .ex-list .vi, .dialog .en, .dialog .vi { font-size: .92em; }
.visual { background: var(--surface-2); border-radius: 14px; padding: 12px; overflow-x: auto; }
.blocks { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.blk { border-radius: 12px; padding: 6px 12px 8px; background: var(--surface); border: 2px solid currentColor; text-align: center; min-width: 64px; }
.blk .role { font-size: .66em; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; display: flex; flex-direction: column; line-height: 1.2; }
.blk .role .vi { color: inherit; opacity: .8; text-transform: none; letter-spacing: 0; font-weight: 500; }
.blk .zh { font-size: 1.35em; color: var(--ink); }
.blk .py { display: block; }
.arr { align-self: center; color: var(--ink-3); font-weight: 700; }
.r-who { color: var(--r-who); } .r-when { color: var(--r-when); } .r-time { color: var(--r-time); } .r-where { color: var(--r-where); } .r-act { color: var(--r-act); }
.r-what { color: var(--r-what); } .r-neg { color: var(--r-neg); } .r-q { color: var(--r-q); } .r-adv { color: var(--r-adv); } .r-link { color: var(--r-link); }
.r-mw { color: var(--r-mw); } .r-desc { color: var(--r-desc); } .r-res { color: var(--r-res); } .r-mark { color: var(--r-mark); } .r-how { color: var(--r-how); } .r-cond { color: var(--r-cond); }
.timeline { position: relative; height: 112px; margin: 8px 10px 0; min-width: 320px; }
.tl-line { position: absolute; left: 0; right: 14px; top: 26px; height: 3px; background: var(--ink-3); border-radius: 2px; }
.tl-arrow { position: absolute; right: 0; top: 14px; color: var(--ink-3); font-size: .9em; }
.tl-mark { position: absolute; top: 18px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; text-align: center; width: 120px; }
.tl-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); }
.tl-mark.now .tl-dot { background: var(--bad); }
.tl-lbl .zh { font-size: 1.05em; }
.tbl-wrap { overflow-x: auto; }
table.cmp { width: 100%; border-collapse: collapse; }
table.cmp th, table.cmp td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
table.cmp thead th { font-size: 1.3em; color: var(--accent-2); }
table.cmp tbody th { font-size: .86em; color: var(--ink-2); width: 30%; }
.cmp-ex { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

<script>/* ===== CONTENT REGISTRY (core/registry.js) ===== */
/* =====================================================================
   HSK 1–3 Grammar Course — content registry
   ---------------------------------------------------------------------
   Content is plain data. Each unit file calls HSK.unit({...}).

   UNIT    { id, lv (1|2|3), zh, en, vi, lessons:[LESSON] }
   LESSON  { id, zh, en, vi, goal:[en,vi] (can-do statement),
             words:[[zh, pinyin, en, vi]]   ← NEW vocabulary taught in this lesson
             points:[POINT], compare?:[CMP], dialog?:DIALOG, items:[ITEM] }
   POINT   { id, t (short name), p (pattern), en, vi (meaning),
             why:[en,vi] (short explanation), ex:[[zh,en,vi]],
             vis?:VIS, tip?:[en,vi] (note for Vietnamese speakers),
             mis?:[[wrong, right, en, vi]] (typical mistake) }
   VIS     { k:'blocks', rows:[[[chunk, role]]] }            word-order boxes
           { k:'time', marks:[[pos(0–100), zh, en, vi]], now? } simple timeline
   CMP     { title, a, b, rows:[[en, vi, a-text, b-text]], ex:[[zhA, zhB]] }
   DIALOG  { title:[en,vi], lines:[[speaker, zh, en, vi]] }
   ITEM    common: t, g (point id), et (error category), h:[[en,vi],[en,vi]] hints,
                   e:[en,vi] explanation, s:'t' (mini check), st (stage override),
                   pic?:[[emoji, zh-label?]]
     mc      q (may contain ___), o:[options], a (index), of?:{idx:[en,vi]}
     pick    choose the correct sentence: o:[sentences], a
     match   pairs:[[zh, en, vi]]
     fill    q with ___ ; a:[[accepted…]] per blank ; bank?:[words] (tap-to-fill)
     spot    tap the wrong part: seg:[segments], a (index), fix (corrected sentence)
     order   c:[chunks in correct order], alt?:[other accepted full sentences]
     dlg     d:[[speaker, zh | null]] (null = the missing line), o:[options], a
     fix | complete | vi | en | short   open answers:
             q, a:[accepted/model answers], req?:['A|B'], bad?:[[regex, [en,vi], et]]
             (short = personal answer; always compared with the model)
   ===================================================================== */
(function (g) {
  'use strict';
  const HSK = g.HSK = g.HSK || {};
  HSK.units = [];
  HSK.PY = HSK.PY || {};
  HSK.unit = function (u) { HSK.units.push(u); };

  HSK.LEVELS = {
    1: { zh: '一级', en: 'HSK 1', vi: 'HSK 1', d: ['Foundations: word order, questions, numbers, time and simple sentences.', 'Nền tảng: trật tự từ, câu hỏi, số đếm, thời gian và câu đơn.'] },
    2: { zh: '二级', en: 'HSK 2', vi: 'HSK 2', d: ['Actions in time, comparison, linking words and complements.', 'Hành động theo thời gian, so sánh, từ nối và bổ ngữ.'] },
    3: { zh: '三级', en: 'HSK 3', vi: 'HSK 3', d: ['Longer sentences, aspect, complements, 把 and 被, and connected speech.', 'Câu dài hơn, thể, bổ ngữ, câu 把 và 被, và nói/viết liền mạch.'] }
  };

  /* Simple mistake labels shown to learners */
  HSK.ERR = {
    wo:    { en: 'Word order', vi: 'Trật tự từ' },
    word:  { en: 'Wrong word', vi: 'Dùng sai từ' },
    miss:  { en: 'Missing word', vi: 'Thiếu từ' },
    extra: { en: 'Extra word', vi: 'Thừa từ' },
    q:     { en: 'Question structure', vi: 'Cấu trúc câu hỏi' },
    neg:   { en: 'Negation', vi: 'Phủ định' },
    mw:    { en: 'Measure word', vi: 'Lượng từ' },
    time:  { en: 'Time expression', vi: 'Biểu đạt thời gian' },
    cmp:   { en: 'Comparison', vi: 'So sánh' },
    asp:   { en: 'Aspect (了 / 过 / 在)', vi: 'Thể (了 / 过 / 在)' },
    comp:  { en: 'Complement', vi: 'Bổ ngữ' }
  };

  /* Word-order roles used in the visual blocks */
  HSK.ROLES = {
    who:   ['Who', 'Ai'], when: ['When', 'Khi nào'], time: ['What time', 'Mấy giờ'], where: ['Where', 'Ở đâu'],
    how:   ['How', 'Thế nào'], act: ['Action', 'Hành động'], what: ['What', 'Cái gì'], desc: ['Description', 'Miêu tả'],
    neg:   ['Not', 'Phủ định'], q: ['Question', 'Câu hỏi'], adv: ['Adverb', 'Phó từ'], link: ['Link word', 'Từ nối'],
    mw:    ['Number + measure', 'Số + lượng từ'], res: ['Result', 'Kết quả'], mark: ['Marker', 'Trợ từ'], cond: ['Condition', 'Điều kiện']
  };

  HSK.TYPES = {
    mc:       ['Multiple choice', 'Chọn đáp án'],
    pick:     ['Choose the correct sentence', 'Chọn câu đúng'],
    match:    ['Match', 'Nối'],
    fill:     ['Fill in the blank', 'Điền vào chỗ trống'],
    spot:     ['Find the mistake', 'Tìm lỗi sai'],
    order:    ['Arrange the sentence', 'Sắp xếp câu'],
    dlg:      ['Mini dialogue', 'Hội thoại ngắn'],
    fix:      ['Correct the mistake', 'Sửa câu sai'],
    complete: ['Complete the sentence', 'Hoàn thành câu'],
    vi:       ['Vietnamese → Chinese', 'Dịch Việt → Trung'],
    en:       ['English → Chinese', 'Dịch Anh → Trung'],
    short:    ['Your answer', 'Câu trả lời của bạn']
  };
  HSK.OPEN = ['fix', 'complete', 'vi', 'en', 'short'];

  /* Lesson steps: Learn → Controlled practice → Guided production → Independent production → Check */
  HSK.STAGES = [
    { k: 'learn', en: 'Learn', vi: 'Học', zh: '学' },
    { k: 'ctrl',  en: 'Practice', vi: 'Luyện tập', zh: '练' },
    { k: 'build', en: 'Build', vi: 'Xây câu', zh: '造句' },
    { k: 'use',   en: 'Use it', vi: 'Vận dụng', zh: '用' },
    { k: 'test',  en: 'Check', vi: 'Kiểm tra', zh: '测' }
  ];
  HSK.PRACTICE_STAGES = ['ctrl', 'build', 'use', 'test'];
  HSK.stageOf = function (it) {
    if (it.st) return it.st;
    if (it.s === 't') return 'test';
    if (['mc', 'pick', 'match', 'fill'].includes(it.t)) return 'ctrl';
    if (['order', 'spot', 'fix', 'complete', 'dlg'].includes(it.t)) return 'build';
    return 'use';
  };

  /* Build look-up tables once all unit files have loaded */
  HSK.index = function () {
    HSK.lessons = []; HSK.points = {}; HSK.lessonById = {}; HSK.items = {}; HSK.unitById = {};
    let n = 0;
    HSK.units.forEach((u, ui) => {
      u.no = ui + 1; HSK.unitById[u.id] = u;
      u.lessons.forEach((l, li) => {
        n++;
        l.no = n; l.unit = u; l.lv = u.lv; l.idx = HSK.lessons.length;
        HSK.lessons.push(l); HSK.lessonById[l.id] = l;
        l.words = l.words || [];
        l.points.forEach(p => { p.lesson = l; HSK.points[p.id] = p; });
        l.items.forEach((it, k) => {
          it.id = it.id || `${l.id}.${k + 1}`;
          it.lesson = l.id; it.unit = u.id; it.lv = u.lv;
          if (!it.g) it.g = l.points[0].id;
          it.stage = HSK.stageOf(it);
          HSK.items[it.id] = it;
        });
      });
    });
    /* Cumulative reviews: after every unit, plus a final review for each level */
    HSK.REVIEWS = [];
    HSK.units.forEach((u, ui) => {
      const lvUnits = HSK.units.filter(x => x.lv === u.lv);
      const last = lvUnits[lvUnits.length - 1] === u;
      const upto = HSK.lessons.filter(l => l.idx <= u.lessons[u.lessons.length - 1].idx);
      const levelStart = HSK.lessons.find(l => l.lv === u.lv);
      const from = last ? levelStart : (ui > 0 && HSK.units[ui - 1].lv === u.lv ? levelStart : u.lessons[0]);
      const range = upto.filter(l => l.idx >= from.idx);
      const first = range[0].no, lastNo = range[range.length - 1].no;
      HSK.REVIEWS.push({
        id: 'r-' + u.id, after: u.id, lv: u.lv, final: last,
        focus: u.lessons.map(l => l.id), lessons: range.map(l => l.id), recycle: upto.filter(l => l.idx < from.idx).map(l => l.id),
        en: last ? `HSK ${u.lv} Final Review` : `Review: Lessons ${first}–${lastNo}`,
        vi: last ? `Ôn tập tổng hợp HSK ${u.lv}` : `Ôn tập: Bài ${first}–${lastNo}`,
        zh: last ? `HSK ${u.lv} 总复习` : `复习 第${first}–${lastNo}课`,
        n: last ? 24 : 15
      });
    });
  };
})(window);

</script>

HSK.unit({

  lessons: [
  /* ================================================================ L1 */
  {

    goal: ['Say who you are and who you are not.', 'Nói mình là ai và không phải là ai.'],
    words: [

<script>/* ===== VOCABULARY CONTROL (core/vocab.js) ===== */
/* =====================================================================
   Vocabulary control
   ---------------------------------------------------------------------
   Every lesson declares the NEW words it teaches (lesson.words).
   A lesson may use: words of this lesson + words of all earlier lessons.
   segment() splits Chinese text into known words (dynamic programming,
   fewest words wins). Characters that cannot be covered are reported,
   so any example or exercise that uses an untaught word is caught.
   Used by: the build-time validator (Node) and the Teacher → Vocabulary check.
   ===================================================================== */
(function (HSK) {
  'use strict';
  const HAN = /[㐀-鿿]/;
  let dict = null, maxLen = 1;

  function build() {
    dict = {}; maxLen = 1;
    HSK.lessons.forEach(l => (l.words || []).forEach(w => {
      if (!dict[w[0]]) dict[w[0]] = { zh: w[0], py: w[1], en: w[2], vi: w[3], lesson: l.id, idx: l.idx, lv: l.lv };
      maxLen = Math.max(maxLen, w[0].length);
    }));
    return dict;
  }
  function D() { return dict || build(); }

  /* words allowed at a lesson (by index): everything introduced up to and including it */
  const allowedCache = {};
  function allowed(idx) {
    if (allowedCache[idx]) return allowedCache[idx];
    const s = new Set();
    Object.values(D()).forEach(e => { if (e.idx <= idx) s.add(e.zh); });
    return (allowedCache[idx] = s);
  }

  /* DP segmentation. Unknown Chinese characters cost a lot, so they only
     appear when no known word covers them. Returns tokens with flags. */
  function segment(text, set) {
    set = set || new Set(Object.keys(D()));
    const s = String(text), n = s.length;
    const cost = new Array(n + 1).fill(Infinity), prev = new Array(n + 1).fill(-1), kind = new Array(n + 1);
    cost[0] = 0;
    for (let i = 0; i < n; i++) {
      if (cost[i] === Infinity) continue;
      const ch = s[i];
      if (!HAN.test(ch)) { // pass-through run of non-Chinese characters
        let j = i; while (j < n && !HAN.test(s[j])) j++;
        if (cost[i] < cost[j]) { cost[j] = cost[i]; prev[j] = i; kind[j] = 'x'; }
        continue;
      }
      for (let L = Math.min(maxLen, n - i); L >= 1; L--) {
        const w = s.substr(i, L);
        if (set.has(w) && cost[i] + 1 < cost[i + L]) { cost[i + L] = cost[i] + 1; prev[i + L] = i; kind[i + L] = 'w'; }
      }
      if (cost[i] + 1000 < cost[i + 1]) { cost[i + 1] = cost[i] + 1000; prev[i + 1] = i; kind[i + 1] = 'u'; }
    }
    const out = []; let j = n;
    while (j > 0) { const i = prev[j]; out.unshift({ t: s.slice(i, j), k: kind[j] }); j = i; }
    return out;
  }
  function unknownIn(text, idx) {
    return segment(text, allowed(idx)).filter(t => t.k === 'u').map(t => t.t);
  }

  /* All Chinese strings a lesson shows to learners (examples, exercises, answers) */
  function strings(l) {
    const out = [];
    const add = (where, s) => { if (s && HAN.test(String(s))) out.push([where, String(s)]); };
    l.points.forEach(p => {
      (p.ex || []).forEach(e => add(p.id + ' example', e[0]));
      (p.mis || []).forEach(m => { add(p.id + ' mistake', m[0]); add(p.id + ' mistake', m[1]); });
      if (p.vis && p.vis.rows) p.vis.rows.forEach(r => add(p.id + ' visual', r.map(c => c[0]).join('')));
      if (p.vis && p.vis.marks) p.vis.marks.forEach(m => add(p.id + ' timeline', m[1]));
    });
    (l.compare || []).forEach(c => { (c.ex || []).forEach(e => e.forEach(x => add('compare', x))); c.rows.forEach(r => { add('compare', r[2]); add('compare', r[3]); }); });
    if (l.dialog) l.dialog.lines.forEach(x => add('dialogue', x[1]));
    l.items.forEach(it => {
      const w = it.id;
      add(w, it.q); (it.o || []).forEach(o => add(w, o)); (it.c || []).forEach(c => add(w, c));
      (it.seg || []).forEach(x => add(w, x));
      add(w, it.fix); (it.alt || []).forEach(a => add(w, a));
      (it.bank || []).forEach(b => add(w, b));
      (it.pairs || []).forEach(p => add(w, p[0]));
      (it.d || []).forEach(x => add(w, x[1]));
      (it.pic || []).forEach(x => add(w, x[1]));
      if (Array.isArray(it.a)) it.a.forEach(a => Array.isArray(a) ? a.forEach(x => add(w + ' answer', x)) : add(w + ' answer', a));
    });
    return out;
  }

  /* Report: [{lesson, where, text, unknown}] */
  function check(lessons) {
    const rep = [];
    (lessons || HSK.lessons).forEach(l => strings(l).forEach(([where, s]) => {
      const u = unknownIn(s, l.idx);
      if (u.length) rep.push({ lesson: l.id, where, text: s, unknown: [...new Set(u)] });
    }));
    return rep;
  }

  function lookup(w) { return D()[w] || null; }
  function known(idx) { return Object.values(D()).filter(e => e.idx <= idx); }

  HSK.Vocab = { build, segment, allowed, unknownIn, strings, check, lookup, known, get dict() { return D(); } };
})(window.HSK);

</script>
<script>/* ===== ANSWER CHECKING (core/grader.js) ===== */
/* =====================================================================
   Answer checking — pure functions, no DOM.
   grade(item, answer) → { ok: true | false | null, fb?:[en,vi], et?, … }
     true  = correct      false = incorrect (with feedback / category)
     null  = cannot be marked automatically → learner compares with the model
   ===================================================================== */
(function (HSK) {
  'use strict';
  const PUNCT = /[\s，。、；：？！“”‘’"'（）()《》…—\-–,.;:?!·~～]/g;
  function toHalf(s) { return s.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' '); }
  function norm(s) { return toHalf(String(s || '')).replace(PUNCT, '').toLowerCase(); }
  function compact(s) { return String(s || '').replace(/\s+/g, '').replace(/,/g, '，').replace(/\?/g, '？').replace(/\./g, '。'); }
  const alts = spec => String(spec).split('|');
  const matchAny = (n, list) => (list || []).some(a => norm(a) === n);

  function gradeChoice(item, idx) {
    if (idx === item.a) return { ok: true };
    return { ok: false, et: item.et, fb: item.of && item.of[idx] };
  }
  /* match: answer = array; answer[i] = index of the meaning chosen for pair i */
  function gradeMatch(item, ans) {
    const wrong = []; item.pairs.forEach((_, i) => { if (ans[i] !== i) wrong.push(i); });
    return wrong.length ? { ok: false, et: item.et, wrongIdx: wrong } : { ok: true };
  }
  function gradeFill(item, values) {
    const wrong = [];
    item.a.forEach((acc, i) => { if (!matchAny(norm(values[i]), acc)) wrong.push(i); });
    if (!wrong.length) return { ok: true };
    const r = { ok: false, et: item.et, wrongIdx: wrong };
    if (item.of) { const v = String(values[wrong[0]] || '').trim(); if (item.of[v]) r.fb = item.of[v]; }
    return r;
  }
  function gradeOrder(item, order) {
    const joined = norm(order.map(i => item.c[i]).join(''));
    if (matchAny(joined, [item.c.join('')].concat(item.alt || []))) return { ok: true };
    const mis = []; order.forEach((ci, pos) => { if (ci !== pos) mis.push(pos); });
    let firstOk = 0; while (firstOk < order.length && order[firstOk] === firstOk) firstOk++;
    return { ok: false, et: item.et || 'wo', misplaced: mis, firstOk };
  }
  function gradeOpen(item, text) {
    const n = norm(text);
    if (!n) return { ok: false, empty: true };
    if (item.t !== 'short' && matchAny(n, item.a)) return { ok: true };
    if (item.t === 'fix' && n === norm(item.q)) return { ok: false, et: item.et, fb: ["You haven't changed the sentence yet.", 'Bạn chưa sửa câu.'] };
    const c = compact(text);
    for (const b of item.bad || []) {
      try { if (new RegExp(b[0]).test(c)) return { ok: false, fb: b[1], et: b[2] || item.et }; } catch (e) { /* ignore */ }
    }
    const missing = (item.req || []).filter(spec => !alts(spec).some(a => n.includes(norm(a))));
    if (missing.length) return { ok: false, et: item.et, missing: missing.map(m => alts(m).join(' / ')) };
    if (item.t === 'short' && !/[㐀-鿿]/.test(text)) return { ok: false, fb: ['Please answer in Chinese characters.', 'Hãy trả lời bằng chữ Hán.'] };
    if (item.t === 'short' && matchAny(n, item.a)) return { ok: null, same: true };
    return { ok: null };
  }
  function grade(item, answer) {
    switch (item.t) {
      case 'mc': case 'pick': case 'dlg': case 'spot': return gradeChoice(item, answer);
      case 'match': return gradeMatch(item, answer);
      case 'fill': return gradeFill(item, answer);
      case 'order': return gradeOrder(item, answer);
      default: return gradeOpen(item, answer);
    }
  }
  function fillSentence(item, vals) { let i = 0; return item.q.replace(/_{3,}/g, () => vals[i++] || '___'); }
  function answerText(item) {
    switch (item.t) {
      case 'mc': return /_{3,}/.test(item.q || '') ? item.q.replace(/_{3,}/, item.o[item.a]) : item.o[item.a];
      case 'pick': return item.o[item.a];
      case 'dlg': return item.o[item.a];
      case 'spot': return item.fix;
      case 'match': return item.pairs.map(p => p[0]).join(' · ');
      case 'fill': return fillSentence(item, item.a.map(x => x[0]));
      case 'order': return item.c.join('');
      case 'complete': return /_{3,}/.test(item.q) ? item.q.replace(/_{3,}/, item.a[0]) : item.a[0];
      default: return item.a[0];
    }
  }
  HSK.Grader = { norm, compact, grade, answerText, fillSentence };
})(window.HSK);

</script>
<script>/* ===== PROGRESS STORAGE (core/store.js) ===== */
/* =====================================================================
   Progress storage — localStorage with an in-memory fallback.
   Holds learner progress, learner settings and (separately) teacher settings.
   ===================================================================== */
(function (HSK) {
  'use strict';
  const KEY = 'hsk13-grammar-v1';
  const MASTER_STREAK = 2;   // correct first-try answers in a row that mark a mistake as mastered

  function blank() {
    return {
      v: 1,
      settings: { theme: 'auto', fs: 1, py: 'auto', en: true, vi: true },
      teacher: { pyAllow: true, trAllow: true, showAnswer: true, retry: true, shuffle: true, present: false, hidden: {}, lessonPy: {} },
      lessons: {},   // lid → { st:{stage:1}, done, res:{itemId:'first'|'retry'|'fail'} }
      items: {},     // itemId → { n, first, retry, fail, streak, last }
      mistakes: {},  // itemId → { ans, att, et, wrong, first, last, streak, mastered, fixed }
      tot: { att: 0, attOk: 0, pres: 0, first: 0, retry: 0, fail: 0 },
      reviews: {},   // reviewId → best %
      history: [],
      last: null     // { lesson, stage }
    };
  }
  let S = blank(), mem = false;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw), b = blank();
      S = Object.assign(b, d);
      S.settings = Object.assign(b.settings, d.settings || {});
      S.teacher = Object.assign(blank().teacher, d.teacher || {});
      S.tot = Object.assign(blank().tot, d.tot || {});
    }
  } catch (e) { mem = true; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { mem = true; } }

  const Store = {
    get s() { return S; }, save, MASTER_STREAK,
    memoryOnly() { return mem; },
    setting(k, v) { if (v === undefined) return S.settings[k]; S.settings[k] = v; save(); },
    teacher(k, v) { if (v === undefined) return S.teacher[k]; S.teacher[k] = v; save(); },
    lesson(lid) { return S.lessons[lid] || (S.lessons[lid] = { st: {}, done: false, res: {} }); },
    markStage(lid, st) { const L = Store.lesson(lid); if (!L.st[st]) { L.st[st] = 1; save(); } },
    setLast(lid, stage) { S.last = { lesson: lid, stage }; save(); },
    completeLesson(lid) { Store.lesson(lid).done = true; save(); },
    attempt(ok) { S.tot.att++; if (ok) S.tot.attOk++; save(); },

    /* result: 'first' | 'retry' | 'fail'; info: { inLesson, att, ans, et } */
    resolve(item, result, info = {}) {
      const r = S.items[item.id] || (S.items[item.id] = { n: 0, first: 0, retry: 0, fail: 0, streak: 0, last: 0 });
      r.n++; r[result]++; r.last = Date.now();
      S.tot.pres++; S.tot[result]++;
      if (info.inLesson) Store.lesson(item.lesson).res[item.id] = result;
      const m = S.mistakes[item.id];
      if (result === 'first') {
        r.streak++;
        if (m && !m.mastered) { m.streak++; m.fixed = true; if (m.streak >= MASTER_STREAK) { m.mastered = true; m.masteredAt = Date.now(); } }
      } else {
        r.streak = 0;
        const mm = m || (S.mistakes[item.id] = { wrong: 0, streak: 0, mastered: false, first: Date.now() });
        mm.wrong++; mm.att = info.att || mm.att; mm.et = info.et || item.et; mm.last = Date.now(); mm.streak = 0; mm.mastered = false;
        if (info.ans) mm.ans = info.ans;
        if (result === 'retry') mm.fixed = true;
      }
      if (m && result !== 'fail') m.fixed = true;
      save();
    },
    clearLessonResults(lid, stage) {
      const L = Store.lesson(lid);
      Object.keys(L.res).forEach(id => { if (!stage || (HSK.items[id] && HSK.items[id].stage === stage)) delete L.res[id]; });
      save();
    },
    addHistory(h) {
      S.history.unshift(Object.assign({ ts: Date.now() }, h)); S.history = S.history.slice(0, 100);
      if (h.review) S.reviews[h.id] = Math.max(S.reviews[h.id] || 0, Math.round(100 * h.score / Math.max(1, h.total)));
      save();
    },
    exportJSON() { return JSON.stringify(S); },
    importJSON(t) { const d = JSON.parse(t); if (!d || !d.tot) throw new Error('bad'); S = Object.assign(blank(), d); save(); },
    reset() { const keepS = S.settings, keepT = S.teacher; S = blank(); S.settings = keepS; S.teacher = keepT; save(); }
  };
  HSK.Store = Store;
})(window.HSK);

</script>
<script>/* ===== LEARNING ENGINE (core/engine.js) ===== */
/* =====================================================================
   Learning engine — selection of exercises, mastery, reviews, statistics.
   No DOM here.
   ===================================================================== */
(function (HSK) {
  'use strict';
  const St = HSK.Store;
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const visible = it => !St.s.teacher.hidden[it.id];

  function stageItems(l, stage) {
    const list = l.items.filter(it => it.stage === stage && visible(it));
    return list;
  }
  /* mastery of one grammar point, from every presentation of its items */
  function pointStats(pid) {
    let n = 0, first = 0, retry = 0, fail = 0;
    Object.values(HSK.items).forEach(it => {
      if (it.g !== pid) return;
      const r = St.s.items[it.id]; if (!r) return;
      n += r.n; first += r.first; retry += r.retry; fail += r.fail;
    });
    const acc = n ? (first + retry) / n : 0, firstAcc = n ? first / n : 0;
    let status = 'new';
    if (n) status = (acc >= 0.8 && firstAcc >= 0.6 && n >= 3) ? 'mastered' : (acc < 0.6 || firstAcc < 0.4) ? 'review' : 'learning';
    return { n, first, retry, fail, acc, firstAcc, status };
  }
  const STATUS = {
    new: { en: 'Not started', vi: 'Chưa học', cls: '' },
    learning: { en: 'Learning', vi: 'Đang học', cls: 'mid' },
    mastered: { en: 'Mastered', vi: 'Đã nắm vững', cls: 'ok' },
    review: { en: 'Needs review', vi: 'Cần ôn lại', cls: 'bad' }
  };
  function lessonProgress(l) {
    const L = St.s.lessons[l.id] || { st: {}, res: {} };
    const items = l.items.filter(visible);
    const done = items.filter(it => L.res[it.id]).length;
    return { done, total: items.length, pct: items.length ? done / items.length : 0, complete: !!L.done, stages: L.st || {} };
  }
  function currentLesson() {
    const last = St.s.last && HSK.lessonById[St.s.last.lesson];
    if (last && !(St.s.lessons[last.id] || {}).done) return last;
    return HSK.lessons.find(l => !(St.s.lessons[l.id] || {}).done) || HSK.lessons[HSK.lessons.length - 1];
  }
  /* review session: unlabelled mix, weighted toward the unit just finished, with recycling */
  function buildReview(r) {
    const pool = id => HSK.lessonById[id].items.filter(it => visible(it) && it.t !== 'short');
    const focus = shuffle(r.focus.flatMap(pool));
    const range = shuffle(r.lessons.filter(id => !r.focus.includes(id)).flatMap(pool));
    const old = shuffle((r.recycle || []).flatMap(pool));
    const nF = Math.round(r.n * (r.final ? 0.35 : 0.55)), nO = Math.round(r.n * (r.recycle.length ? 0.2 : 0));
    let out = focus.slice(0, nF).concat(old.slice(0, nO));
    out = out.concat(range.filter(x => !out.includes(x)).slice(0, r.n - out.length));
    if (out.length < r.n) out = out.concat(focus.filter(x => !out.includes(x)).slice(0, r.n - out.length));
    // spread item types: avoid long runs of the same type
    return shuffle(out).sort((a, b) => ['mc', 'pick', 'match', 'fill', 'dlg', 'spot', 'order', 'fix', 'complete', 'vi', 'en'].indexOf(a.t) - ['mc', 'pick', 'match', 'fill', 'dlg', 'spot', 'order', 'fix', 'complete', 'vi', 'en'].indexOf(b.t) + (Math.random() - 0.5) * 6);
  }
  function mistakeItems(onlyOpen) {
    return Object.entries(St.s.mistakes).filter(([id, m]) => HSK.items[id] && (!onlyOpen || !m.mastered))
      .sort((a, b) => (b[1].last || 0) - (a[1].last || 0)).map(([id]) => HSK.items[id]);
  }
  function weakItems(lv, n = 12) {
    const weak = Object.keys(HSK.points).filter(pid => { const s = pointStats(pid); return s.status === 'review' || s.status === 'learning'; })
      .filter(pid => !lv || HSK.points[pid].lesson.lv === lv);
    const items = Object.values(HSK.items).filter(it => weak.includes(it.g) && visible(it) && it.t !== 'short');
    return shuffle(items).slice(0, n);
  }
  function mixedItems(lv, n = 12) {
    const done = HSK.lessons.filter(l => l.lv === lv && Object.keys((St.s.lessons[l.id] || {}).res || {}).length);
    const src = (done.length ? done : HSK.lessons.filter(l => l.lv === lv).slice(0, 2)).flatMap(l => l.items.filter(it => visible(it) && it.t !== 'short'));
    return shuffle(src).slice(0, n);
  }
  function totals() {
    const t = St.s.tot;
    const pts = Object.keys(HSK.points).map(pointStats);
    const ms = Object.values(St.s.mistakes);
    return {
      lessonsDone: HSK.lessons.filter(l => (St.s.lessons[l.id] || {}).done).length,
      answered: t.pres, acc: t.pres ? (t.first + t.retry) / t.pres : 0, firstAcc: t.pres ? t.first / t.pres : 0,
      mastered: pts.filter(p => p.status === 'mastered').length, review: pts.filter(p => p.status === 'review').length,
      corrected: ms.filter(m => m.fixed).length, openMistakes: ms.filter(m => !m.mastered).length
    };
  }
  HSK.Engine = { shuffle, stageItems, pointStats, STATUS, lessonProgress, currentLesson, buildReview, mistakeItems, weakItems, mixedItems, totals, visible };
})(window.HSK);

</script>
<script>/* ===== UI COMPONENTS (ui/components.js) ===== */
/* =====================================================================
   UI components — DOM helper, speech, pinyin/translation display,
   and the exercise card with the corrective feedback cycle:
   Attempt → Hint → Retry → Stronger hint → Retry → Answer + explanation
   ===================================================================== */
(function (HSK) {
  'use strict';
  const G = HSK.Grader, St = HSK.Store;
  const MAX_WRONG = 3;

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; el.appendChild(c.nodeType ? c : document.createTextNode(String(c))); });
    return el;
  }
  function toast(msg) { const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
  const T = St.s.teacher;
  const trOK = () => St.s.teacher.trAllow !== false;

        vbox.appendChild(rep.length ? h('div', null, h('p', { class: 'chip bad' }, rep.length + ' problem(s)'), rep.slice(0, 50).map(r => h('div', { class: 'small' }, r.lesson + ' · ' + r.where + ': ', h('span', { class: 'zh' }, r.text), ' → ', r.unknown.join(' '))))
          : h('p', null, h('span', { class: 'chip ok' }, '✓ All clear'), ` ${nStr} Chinese texts in ${HSK.lessons.length} lessons use only taught vocabulary (${Object.keys(HSK.Vocab.dict).length} words).`));
      } }, 'Run check'), vbox,
      h('details', null, h('summary', null, `Word list for lesson ${l.no}`), h('div', { class: 'small' }, HSK.Vocab.known(l.idx).filter(w => w.idx === l.idx).map(w => w.zh + ' ' + w.py).join(' · ')))));
    /* progress data */
    const ta = h('textarea', { id: 't-data', rows: 3, class: 'ans', placeholder: 'Paste progress data here to import' });
    el.appendChild(h('section', { class: 'card' }, h('h2', null, 'Progress data · Dữ liệu tiến độ'),
      h('div', { class: 'row' },
        h('button', { class: 'btn', type: 'button', onclick: () => { ta.value = St.exportJSON(); ta.select(); try { navigator.clipboard.writeText(ta.value).then(() => toast('Copied'), () => { }); } catch (e) { } } }, 'Copy progress'),
        h('button', { class: 'btn', type: 'button', onclick: () => { try { St.importJSON(ta.value); toast('Imported'); go('progress'); } catch (e) { toast('That is not valid progress data.'); } } }, 'Import'),
        h('button', { class: 'btn danger', type: 'button', onclick: ev => { if (ev.target.dataset.sure) { St.reset(); toast('Progress reset'); go('progress'); } else { ev.target.dataset.sure = 1; ev.target.textContent = 'Click again to reset all progress'; } } }, 'Reset progress')), ta));
  };

  HSK.Views = V;
})(window.HSK);

</script>
<script>/* ===== APP SHELL (ui/app.js) ===== */
/* =====================================================================
   App shell — navigation (Learn | Practice | Review | My Progress),
   learner settings panel, routing.
   ===================================================================== */
(function (HSK) {
  'use strict';
  HSK.index();
  HSK.Vocab.build();
  const { h } = HSK.UI;
  const St = HSK.Store;
  const NAV = [['learn', '📖', 'Learn', 'Học'], ['practice', '✏️', 'Practice', 'Luyện'], ['review', '🔁', 'Review', 'Ôn'], ['progress', '📈', 'My Progress', 'Tiến độ']];
  const SECTION = { learn: 'learn', lesson: 'learn', practice: 'practice', session: 'practice', review: 'review', reviewRun: 'review', mistakes: 'review', progress: 'progress', teacher: 'progress' };
  let route = { view: 'learn', p: {} };

  function applySettings() {
    const s = St.s.settings, root = document.documentElement;
    if (s.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', s.theme);
    root.style.setProperty('--fs', St.s.teacher.present ? 1.35 : s.fs);
    document.body.classList.toggle('present', !!St.s.teacher.present);
  }

  const app = document.getElementById('app');
  const main = h('main', { id: 'main', tabindex: '-1' });
  const topNav = h('nav', { class: 'top-nav', 'aria-label': 'Main' });
  const botNav = h('nav', { class: 'bot-nav', 'aria-label': 'Main' });
  const panel = h('div', { class: 'settings', hidden: true, role: 'dialog', 'aria-label': 'Settings' });
  const header = h('header', { class: 'topbar' },
    h('button', { class: 'brand', type: 'button', onclick: () => go('learn') }, h('span', { class: 'logo zh' }, '语法'), h('span', { class: 'brand-t' }, h('b', null, 'Grammar Steps'), h('span', null, 'HSK 1–3'))),
    topNav,
    h('div', { class: 'top-right' },
      St.s.teacher.present ? h('button', { class: 'pill', type: 'button', onclick: () => { St.teacher('present', false); applySettings(); render(); } }, 'Exit projector') : null,
      h('button', { class: 'aa', type: 'button', 'aria-label': 'Display settings', title: 'Pinyin, translations, text size', onclick: () => { panel.hidden = !panel.hidden; if (!panel.hidden) drawPanel(); } }, 'Aa')));
  app.appendChild(header); app.appendChild(panel); app.appendChild(main); app.appendChild(botNav);

  function drawNav() {
    const sec = SECTION[route.view];
    [topNav, botNav].forEach(n => {
      n.innerHTML = '';
      NAV.forEach(([k, ic, en, vi]) => n.appendChild(h('button', { class: 'nav-b' + (sec === k ? ' on' : ''), type: 'button', 'aria-current': sec === k ? 'page' : null, onclick: () => go(k) },
        h('span', { class: 'ic', 'aria-hidden': 'true' }, ic), h('span', { class: 'nl' }, en), St.setting('vi') !== false ? h('span', { class: 'nl vi' }, vi) : null,
        k === 'review' && Object.values(St.s.mistakes).filter(m => !m.mastered).length ? h('span', { class: 'badge' }, Object.values(St.s.mistakes).filter(m => !m.mastered).length) : null)));
    });
  }
  function seg(label, key, opts, disabled, note) {
    return h('div', { class: 'set-row' }, h('div', { class: 'set-l' }, label),
      h('div', { class: 'seg-ctl' + (disabled ? ' dis' : '') }, opts.map(([v, t]) => h('button', { type: 'button', class: St.setting(key) === v ? 'on' : '', disabled: !!disabled, onclick: () => { St.setting(key, v); applySettings(); drawPanel(); render(); } }, t))),
      note ? h('div', { class: 'small muted' }, note) : null);
  }
  function drawPanel() {
    const T = St.s.teacher;
    panel.innerHTML = '';
    panel.appendChild(h('div', { class: 'set-head' }, h('b', null, 'Display · Hiển thị'), h('button', { class: 'x', type: 'button', 'aria-label': 'Close', onclick: () => { panel.hidden = true; } }, '✕')));
    panel.appendChild(seg('Pinyin', 'py', [['auto', 'Auto'], ['on', 'Show'], ['off', 'Hide']], !T.pyAllow, !T.pyAllow ? 'Turned off by your teacher · Giáo viên đã tắt' : 'Auto: shown in HSK 1, fading in HSK 2–3 · Tự động: hiện ở HSK 1, dần ẩn ở HSK 2–3'));
    panel.appendChild(seg('English', 'en', [[true, 'On'], [false, 'Off']], !T.trAllow));
    panel.appendChild(seg('Tiếng Việt', 'vi', [[true, 'Bật'], [false, 'Tắt']], !T.trAllow, !T.trAllow ? 'Translations turned off by your teacher · Giáo viên đã tắt bản dịch' : null));
    panel.appendChild(seg('Text size · Cỡ chữ', 'fs', [[0.9, 'S'], [1, 'M'], [1.15, 'L'], [1.3, 'XL']]));
    panel.appendChild(seg('Theme · Giao diện', 'theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']]));
    panel.appendChild(h('p', { class: 'small muted' }, 'Tip: as you progress, try hiding pinyin and translations. · Mẹo: khi tiến bộ hơn, hãy thử ẩn pinyin và bản dịch.'));
  }
  function render() {
    main.innerHTML = '';
    drawNav();
    const fn = HSK.Views[route.view] || HSK.Views.learn;
    try { fn(main, route.p); }
    catch (e) { console.error(e); main.appendChild(h('div', { class: 'card empty' }, 'Something went wrong on this page. · Có lỗi khi mở trang.')); }
  }
  function go(view, p) {
    route = { view, p: p || {} };
    panel.hidden = true;
    render();
    window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) panel.hidden = true; });
  HSK.App = { go, render, applySettings, get route() { return route; } };
  applySettings();
  const last = St.s.last;
  go('learn');
})(window.HSK);

</script>
</body>
</html>
